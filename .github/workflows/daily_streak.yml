name: TikTok Daily Streak Bot

on:
  schedule:
    # ตั้งเวลาให้รันทุกวัน (ตัวอย่าง: 00:00 UTC หรือ 07:00 น. เวลาไทย)
    - cron: '0 0 * * *'
  workflow_dispatch: # ยอมให้กดรันเองมือถือได้ (Manual Run)

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Create files from secrets
        run: |
          # สร้างไฟล์ .env จาก GitHub Secrets
          echo "${{ secrets.ENV_FILE }}" > .env
          # สร้างไฟล์ cookies.json จาก GitHub Secrets
          echo '${{ secrets.COOKIES_JSON }}' > cookies.json

      - name: Run TikTok Bot
        run: python main.py
        env:
          HEADLESS: "true" # บน GitHub Actions ต้องเป็น true เสมอ
