name: TikTok Daily Streak Bot

on:
  schedule:
    # ตั้งเวลาให้รันทุกวัน (ตัวอย่าง: 00:00 UTC หรือ 07:00 น. เวลาไทย)
    - cron: '0 0 * * *'
  workflow_dispatch: # ยอมให้กดรันเองมือถือได้ (Manual Run)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # ระบุชื่อบัญชีที่ต้องการให้รันตรงนี้ (เช่น account1, account2)
        # คุณสามารถเปลี่ยนชื่อเหล่านี้ได้ตามต้องการ และเพิ่มชื่อใหม่เข้าไปได้
        account: [account1, account2]
      fail-fast: false # ถ้าบัญชีหนึ่งพัง ให้บัญชีอื่นรันต่อจนจบ

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Create files from secrets
        run: |
          # ตรวจสอบและสร้างไฟล์ตามชื่อบัญชีใน Matrix
          if [ "${{ matrix.account }}" == "account1" ]; then
            echo "${{ secrets.ACCOUNT1_ENV }}" > .env.account1
            echo '${{ secrets.ACCOUNT1_COOKIES }}' > cookies_account1.json
          elif [ "${{ matrix.account }}" == "account2" ]; then
            echo "${{ secrets.ACCOUNT2_ENV }}" > .env.account2
            echo '${{ secrets.ACCOUNT2_COOKIES }}' > cookies_account2.json
          fi

      - name: Run TikTok Bot
        # ส่งชื่อบัญชีจาก matrix เข้าไปใน main.py
        run: python main.py ${{ matrix.account }}
        env:
          HEADLESS: "true" # บน GitHub Actions ต้องเป็น true เสมอ
