name: TikTok Daily Streak Bot

on:
  schedule:
    # Run daily at 00:00 UTC (07:00 AM ICT)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  refill_fire:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium --with-deps

    - name: Decode Cookies
      env:
        TIKTOK_COOKIES_BASE64: ${{ secrets.TIKTOK_COOKIES }}
      run: |
        echo "$TIKTOK_COOKIES_BASE64" | base64 --decode > cookies.json

    - name: Run Bot
      env:
        FRIENDS_TO_STREAK: ${{ vars.FRIENDS_TO_STREAK }}
        STREAK_MESSAGE: ${{ vars.STREAK_MESSAGE }}
        CI: true
      run: python main.py

    - name: Upload Debug Screenshot
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: error-screenshot
        path: error_screenshot.png
